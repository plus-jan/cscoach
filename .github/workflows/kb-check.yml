name: Knowledge base check

on:
  pull_request:
  push:
    branches: ["**"]

permissions:
  contents: read

jobs:
  kbcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/kbcheck.py
