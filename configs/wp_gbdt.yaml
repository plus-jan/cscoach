# M3.2 GBDT WP — gated loop task config (docs/specs/07 §2). The `model` block at HEAD~1 is the champion.
# docs/specs/03 WP (features v1, monotone), docs/specs/06 (values and assumptions).
loop:
  task: gbdt_wp
  data: /media/jan/merged/cs2coach/derived/wp_table_v1.parquet
  work_dir: /media/jan/merged/cs2coach/splits/wp_v1
  columns: [match_id, y_ct_win, ct_alive, t_alive, ct_hp_sum, t_hp_sum, ct_armor_sum, t_armor_sum, ct_helmets,
            t_helmets, ct_kits, ct_equip_value, t_equip_value, ct_money_sum, t_money_sum, ct_primaries, t_primaries,
            ct_flashes, t_flashes, ct_smokes, t_smokes, ct_molotovs, t_molotovs, ct_hes, t_hes, man_advantage,
            bomb_planted, bomb_site, time_remaining_s, second_in_round, tier, platform, map_name, channel_set]
  alpha: 0.05             # A-42
  budget: 15              # A-42
  n_resamples: 2000       # A-42
  seed: 20260928
  gates: {ece_max: 0.02, ece_max_per_stratum: 0.03, min_rows_per_stratum: 500, stratum: tier}   # A-06
model:
  label: y_ct_win
  stratum: tier
  features: [ct_alive, t_alive, ct_hp_sum, t_hp_sum, ct_armor_sum, t_armor_sum, ct_helmets, t_helmets, ct_kits, ct_equip_value, t_equip_value, ct_primaries, t_primaries, ct_flashes, t_flashes, ct_smokes, t_smokes, ct_molotovs, t_molotovs, ct_hes, t_hes, man_advantage, bomb_planted, bomb_site, time_remaining_s, map_name, second_in_round]
  categorical: [bomb_site, map_name]
  monotone: {ct_alive: 1, t_alive: -1, ct_hp_sum: 1, t_hp_sum: -1, ct_equip_value: 1, t_equip_value: -1,
             man_advantage: 1}                                                          # A-27
  num_boost_round: 2000   # A-29
  early_stopping_rounds: 100
  es_fraction: 0.1        # A-29: grouped early-stopping slice of the fitting matches
  train_row_fraction: 0.25  # A-29: snapshot thinning for fitting (predictions cover all rows)
  seed: 20260928
  params: {learning_rate: 0.03, num_leaves: 31, min_data_in_leaf: 200, bagging_fraction: 0.8, bagging_freq: 1,
           feature_fraction: 0.8, lambda_l2: 1.0, num_threads: 16}                     # A-29
