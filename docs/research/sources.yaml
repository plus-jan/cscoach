- id: franks_meta_analytics
  title: "Meta-Analytics: Tools for Understanding the Statistical Properties of Sports Metrics"
  authors: Alexander Franks, Alexander D'Amour, Daniel Cervone, Luke Bornn
  year: 2016
  venue: Journal of Quantitative Analysis in Sports 12(4):151-165
  arxiv: "1609.09830"
  url: https://arxiv.org/abs/1609.09830
  questions: [H]
  claim: "Stability, discrimination, independence; r = 0.70 offensive-zone possession vs points (synthesis)"
  verified_claim: "D = 1 − mean bootstrap sampling var / between-player var; S = 1 − E[within-player between-season var − sampling var]/(total − sampling var); I = 1 − R² in a Gaussian-copula latent model; EB shrinkage improves D and S. The synthesis's 'r = 0.70' was not found in the paper."
  use_in_project: docs/specs/04 §4/§7 (player-metric checks), MV.9, A-25, A-08
  license: arXiv — not verified for redistribution
  local: docs/research/papers/franks_meta_analytics.md
  verified: true

