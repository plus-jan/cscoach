  verified_claim: "Per owner's notes of the HLTV articles: opening kill ≈ +20%, 1v1 clutch ≈ +50%; credit split final blow/damage/flash/trade (re-weighted Oct 2025); end-of-round residual shared among clutcher/kill contributors/defuser/alive; eco-adjustment via bucketed duel win rates (44.7% same-bucket duels); 5 s trade window; 40-damage assist; Swing ignores HP and kill location; recalibration after Valve's ~Aug 2025 economy update."
  use_in_project: WPA credit and round-end residual (docs/specs/03#wpa, A-23), eco-adjusted value via xK (M5.2), A-17 convention, A-13 economy change
