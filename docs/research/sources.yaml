# Source registry. Every design claim in docs/specs must cite an entry here by `id`.
#
# verified:  null  = not yet checked
#            search = existence/metadata confirmed via web search only (numbers NOT checked)
#            true  = full text read; `claim` below matches the paper (see local file notes)
#            false = could not be confirmed / claim wrong — do not use as justification
# local:     path to the markdown full text (docs/research/papers/<id>.md), null if missing
# claim:     what the ORIGINAL synthesis claimed; `verified_claim` = what the paper says.
#
# Add PDFs with: python scripts/pdf_to_md.py <file.pdf>   (maps by `arxiv` or --id)

- id: same_player_verification_cs2
  title: Same-Player Verification for Account Consistency in Counter-Strike 2
  note_title_v2: "v2 retitled: Account Consistency from Gameplay Traces: Same-Player Verification in Counter-Strike 2"
  year: 2026
  venue: arXiv preprint (submitted to IEEE)
  arxiv: "2608.24893"
  url: https://arxiv.org/abs/2608.24893
  questions: [A, C]
  claim: "Tree models on mechanical fingerprints reach ROC AUC 0.955; 1,330 demos, 13,300 obs, tiers C..Diamond (Perfect World Arena)"
  use_in_project: execution-vs-decision features (M4.2), tier differences (M3.5), player fingerprint features
  local: docs/research/papers/same_player_verification_cs2.md
  verified: true
  license: arXiv (submitted to IEEE) — not verified for redistribution
  verified_claim: "Mean ROC AUC 0.931 (6 person-disjoint splits; 0.955 = single analysis split); 0.986 with K=10 history demos. Identity verification only — does NOT test rank/tier separation. Data not released."

