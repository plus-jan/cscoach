  claim: "Tree models on mechanical fingerprints reach ROC AUC 0.955; 1,330 demos, 13,300 obs, tiers C..Diamond (Perfect World Arena)"
  verified_claim: "v2: mean AUC 0.926 (3,570 amateur demos, 12 tiers) / 0.956 (539 pro demos), cluster-bootstrap CIs; aim/crosshair strongest; K=10 history 0.982; domain-matched training matters (Table 9). Identity verification only — no rank analysis; data not public."
