  type: data
  source: M1.3 header exploration (docs/FINDINGS.md F-02)
  status: open
  test: [M1.3, M2.1]
  parameters: [quality.wingman_max_unique_steamids, quality.wins_needed]
  blocks: [wp_timeline, wpa]

- id: A-40
  statement: >-
    Missing ticks/events are rare and non-disruptive (per CSDS docs); matches failing quality checks can
    be dropped without biasing tiers/maps.
  type: data
  source: CSDS datasheet; challenged by [learning_to_move_like_pros] §5 (no capture-frequency guarantee)
  status: open
  note: >-
    2026-09-28 (M1.3, F-02): no tick gaps > 1 s, no missing round_end, no warmup leftovers in 8,676
    full-channel matches. Excluding flagged canonical 5v5 matches is flat across maps (0.073-0.087) but
    not platforms (faceit 0.156 vs steam 0.071). M1.4 (F-03, seeded): flat across known tiers
    (0.039-0.056), higher for untiered (0.077). Flagged matches stay stratifiable.
  test: [M1.3, MV.1]
  blocks: []

# ---------------------------------------------------------------- route (research-driven planning)
- id: A-41
  statement: >-
    The planned analysis modules (WP/WPA, duels, economy, spatial/utility) cover the main reasons amateur
    and semi-pro teams lose rounds in CSDS, and the highest-value feedback areas are measurable with CSDS
    channels.
  type: research
  source: "project premise derived from the literature synthesis; to be tested by exploration (ADR-0006)"
  status: open
  test: [E.4]
  blocks: [coaching_feedback]

- id: A-42
  statement: >-
    The gated keep rule of the autoresearch loop (docs/specs/07 §2: keep iff the lower bound of the
    one-sided cluster-bootstrap CI of the improvement over the champion, at level 1 − alpha/budget, is
    > 0, computed on match-grouped out-of-fold predictions from training matches only) keeps a
    no-effect change in ≤ 5% of loops (loop-level false-keep rate), and keeps a true improvement of the
    size that matters for WP (Δlog-loss ≥ 0.002) with ≥ 80% power at the corpus sizes we expect.
  type: method
