# ---------------------------------------------------------------- corpus (CSDS) properties
- id: A-34
  statement: >-
    The CSDS corpus (matches uploaded by PureSkill.gg users; MM/FACEIT mix) is representative enough of
    amateur/semi-pro CS2 for the target tiers; selection bias toward improvement-minded users does not
    distort WP/xK beyond what tier/platform conditioning captures.
  type: data
  source: CSDS datasheet (docs/data/README.md)
  status: open
  test: [MV.2, MV.3]
  blocks: [wp_timeline, coaching_feedback]

- id: A-35
  statement: >-
    Players cannot be linked across matches (steam_id replaced by per-match alias), so player metrics,
    reliability and coaching are within-match only.
  type: constraint
  source: docs/data/csds_spec.md (Redaction), CSDS datasheet
  status: supported
  evidence: [docs/data/csds_spec.md, docs/adr/0005-within-match-player-metrics.md]
  test: []
  blocks: []

- id: A-36
  statement: >-
    Duplicate matches can be detected from header-derived values and removed before splitting; remaining
