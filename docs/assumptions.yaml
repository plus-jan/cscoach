# Assumptions register — SOURCE OF TRUTH (rules: docs/ASSUMPTIONS.md).
#
# Fields
#   id          A-NN, never reused
#   statement   what is assumed (falsifiable where possible)
#   type        research | data | game_rule | method | policy | causal | synthetic | constraint
#   source      where it came from (paper id, "initial choice", CSDS docs, ...)
#   status      open      - untested; fine for development, NOT for player-facing output it blocks
#               supported - tested; evidence links the experiment/ADR/doc
#               refuted   - tested and false; dependent design must change
#               decided   - deliberate policy choice; evidence links the ADR/derivation
#   test        roadmap task(s) that test or decide it
#   parameters  keys in docs/specs/06_parameters.md governed by this assumption
#   blocks      player-facing capabilities that must not ship while status is open/refuted:
#               wp_timeline, wpa, xk, economy_feedback, spatial_feedback, player_metrics, coaching_feedback
#   evidence    links (experiment reports in the code repo, ADRs, papers, docs) — required unless open

# ---------------------------------------------------------------- research hypotheses
- id: A-01
  statement: >-
    WP behaves differently across skill tiers and platforms (e.g. man-advantage conversion), so a WP
    model fitted on one tier/platform is miscalibrated on others; WP must be tier/platform-conditioned
    and recalibrated per stratum.
  type: research
  source: "research_synthesis_de A/C (unverified); indirect [champ_matchmaking] (§5.3), [same_player_verification_cs2] (v2 Table 9); [xenopoulos_valuing_actions_csgo] §VI-D names 'similar skill' as a strong assumption of WPA; pooling with a conditioning feature beat per-group models in [xenopoulos_optimal_economy] (maps); DIRECT prior evidence [xenopoulos_pro_vs_amateur_wp] (CS:GO 2021, PureSkill MM: pro model ECE 0.023 vs 0.004 in-domain, no CIs) — supports the direction; replication on CS2 CSDS tiers pending (MV.3)"
  status: open
  test: [MV.3]
  parameters: [WP features (v1), calibration]
  blocks: [wp_timeline, wpa, coaching_feedback]

- id: A-02
  statement: >-
    Predictive drivers differ by tier ("chaos factor"): e.g. mechanics such as counter-strafing
    matter relatively more in low tiers, utility/structure more in high tiers.
  type: research
  source: research_synthesis_de C (unverified, no verified paper)
  status: open
  test: [MV.12]
  blocks: [coaching_feedback]

- id: A-03
  statement: Counterfactual, prioritised feedback from the engine improves player performance.
  type: causal
  source: research_synthesis_de I; project premise; [play_like_champions] reports no human validation of latent-space feedback
  status: open
  test: [M9.5, M11.1]
  blocks: []   # product premise; communicated as such until M11 — does not block shipping analysis

- id: A-04
  statement: >-
    The calibrated WP model is a valid value function for counterfactual states (states that
    differ from observed ones by one player action), so WPA, Shapley credit and counterfactual
    buy/utility values are meaningful.
  type: causal
  source: design (docs/specs/03); [xenopoulos_valuing_actions_csgo] uses the same premise
  status: open
  test: [MV.10]
  blocks: [wpa, economy_feedback, spatial_feedback, coaching_feedback]

- id: A-05
  statement: >-
    Crossing xK with WP-if-avoided identifies objectively bad duel decisions; thresholds
    xK < 0.30 and WP >= 0.85 define "risky duel".
  type: causal
  source: research_synthesis_de E; initial choice for thresholds
  status: open
  test: [MV.10, M9.5]
  parameters: ["risky duel: max xK / min WP-if-avoided"]
  blocks: [coaching_feedback]

# ---------------------------------------------------------------- acceptance policy
- id: A-06
  statement: >-
    Calibration gates (ECE <= 0.02 overall, 0.03 per tier, 0.035 per map; BSS CI low > 0;
    xK ECE <= 0.03, AUC >= 0.62) are strict enough that WP/xK errors do not materially distort
    WPA and feedback.
  type: policy
  source: initial choice
  status: open
  test: [MV.5]
  parameters: [gates.wp, gates.xk]
  blocks: [wp_timeline, wpa, xk]

- id: A-07
  statement: >-
    Minimum sample sizes (500 rounds/stratum, 1000 duels/stratum, player ESS >= 30) give
    stable estimates.
  type: policy
  source: initial choice
  status: open
  test: [MV.5]
  parameters: [gates.wp.min_rounds_per_stratum, gates.xk.min_duels_per_stratum, gates.player_metric.min_ess]
  blocks: [player_metrics]

- id: A-08
  statement: >-
    Player-metric thresholds (Franks stability >= 0.5, discrimination >= 0.3, independence >= 0.2;
    supplementary split-half reliability >= 0.5) separate useful from useless metrics.
  type: policy
  source: initial choice ([franks_meta_analytics] gives no universal thresholds)
  status: open
  test: [MV.5]
  parameters: [gates.player_metric]
  blocks: [player_metrics]

- id: A-09
  statement: ECE with 15 quantile bins is an adequate calibration summary for gating.
  type: method
  source: convention
  status: open
  test: [MV.5]
  parameters: [ece]
  blocks: []

- id: A-10
  statement: Bootstrap settings (500 resamples, alpha 0.05) give stable interval endpoints.
  type: method
  source: convention
  status: open
  test: [MV.4]
  parameters: [bootstrap]
  blocks: []

# ---------------------------------------------------------------- tiers
- id: A-11
  statement: >-
    Tier cut-offs (FACEIT 1-3/4-6/7-9/10, Premier <10k/10-15k/15-20k/20k+, MM groups) produce tiers that
    differ in play; otherwise tiering is noise.
  type: data
  source: initial choice
  status: open
  test: [MV.2]
  parameters: [FACEIT level → tier, Premier rating → tier, MM skill group → tier]
  note: >-
    2026-09-28 (M1.4, F-03): on the seeded sample, competitive skill groups never map to semipro (64% low) and
    premier is 57% low; the cut-offs are uneven across scales. Whether tiers differ in play is MV.2.
  blocks: [wp_timeline, player_metrics, coaching_feedback]

- id: A-12
  statement: >-
    A match has one meaningful tier (median of >= 6 players with known rank from player_info); the lobby
    rank spread is small enough for a single label; matches without enough ranks can be excluded
    without biasing results.
  type: data
  source: initial choice; CSDS docs (old FACEIT matches lack ranks)
  status: open
  test: [MV.2]
  parameters: [match tier rule, min players with known rank]
  note: >-
    2026-09-28 (M1.4, F-03): tier missing (< 6 known ranks) for 36% competitive, 22% premier, 5% faceit
    seeded 5v5 matches (not random); 17.5% of labelled lobbies span >= 2 tiers. Excluding untiered matches
    would shift the platform/scale mix.
  blocks: [wp_timeline, player_metrics]

# ---------------------------------------------------------------- game rules / tooling
- id: A-13
  statement: >-
    Economy values in docs/specs/06 match the CS2 builds in the corpus (predicted start money equals
    player_status.money at freeze end for >= 99% of player-rounds), per game build. Valve changed the CS2
    economy around Aug 2025, inside the CSDS window (from 2025-07-18), so values differ by build_num.
  type: game_rule
  source: recalled from memory — unverified; economy update noted in [hltv_rating_3]
  status: refuted
  evidence: [docs/data/csds_decoding.md, reports/experiments/20260928-1657_mv1_decoding/report.md]
  note: >-
    2026-09-28 (MV.1, F-07): the recalled values do not match: T plant bonus 600 (not 800), OT start 10000 (not 12500), loss counter -2 per win, CT +50 per T killed (new), Zeus 100, CZ75 300. One rule set for builds 10521-10924. Corrected values in docs/specs/06 reconcile 96.2-97.1% of player-rounds with one personal credit allowed (86-87% exact); >= 99% needs per-player credit tracking (M6.1).
  test: [MV.1]
  parameters: []
  blocks: []  # superseded by A-45 (corrected rules)

- id: A-14
  statement: >-
    Round time 115 s, bomb timer 40 s, freeze time 15 s hold for corpus matches (checked from tick /
    round_state phase durations per platform and build).
  type: game_rule
  source: game defaults (recalled) — servers (esp. FACEIT/third-party) may differ
  status: refuted
  evidence: [docs/data/csds_decoding.md, reports/experiments/20260928-1657_mv1_decoding/report.md]
  note: >-
    2026-09-28 (MV.1, F-07): round time 115.0 s holds; bomb 41.0 s plant->explode (not 40); freeze 15 s or 20 s per match (not always 15). Parameters corrected.
  test: [MV.1]
  parameters: []
  blocks: []  # superseded by A-44 (measured timers)

- id: A-15
  statement: >-
    Undocumented CSDS codes can be decoded reliably from the data: team_code/winner_team_code → side,
    win_reason_code → end reason, weapon_code/weapon_name → weapon class, hit_box_code, site_code,
    rank/rank_type/rank_platform → platform-specific rank scale.
  type: data
  source: docs/data/csds_spec.md lists types but not code meanings
  status: supported
  evidence: [docs/data/csds_decoding.md, reports/experiments/20260928-1657_mv1_decoding/report.md]
  test: [MV.1, MV.2]
  parameters: [rank field decoding, premier_min_rating]
  note: >-
    2026-09-28 (MV.1, F-07): team/winner codes (2 T, 3 CT), win_reason_code (v42), hit_box_code (Source hit groups 0-8), weapon_code (item definition index) decoded; site_code is a per-server entity index, so sites come from the planter's place_name. v30 caveats: stale winner at half starts, no reason codes, 1.2% hit-box garbage.
    2026-09-28 (M1.4, F-03): rank fields decoded (rank_type 11/12/7, FACEIT level in rank_platform); the
    type-free rule for v30 agrees with rank_type in 2,079/2,079 v42 matches with known ranks.
    2026-09-28 (M2.1, F-05): team_code/winner_team_code 2 = T, 3 = CT; v30 winner side is stale in the first
    round of every half (fixed); rounds reconcile with final scores in 99.887% of matches. Win reasons exist
    only in v42 (v30: 8/9 = winner side). Still open: win reason, weapon, hit box, site codes (MV.1).
  blocks: [wp_timeline, xk, economy_feedback, player_metrics]

- id: A-16
  statement: >-
    header.tick_rate is correct per match and CSDS `second`/tick alignment (incl. as-of merged
    positions on events) is accurate enough for sub-second features (duels, counter-strafe).
  type: data
  source: CSDS spec (merged columns use as-of merge to nearest earlier tick); [learning_to_move_like_pros] §5 notes PureSkill.gg data has no capture-frequency guarantee and may drop data
  status: supported
  evidence: [docs/data/csds_decoding.md, reports/experiments/20260928-1657_mv1_decoding/report.md]
  note: >-
    2026-09-28 (MV.1): tick rate 64 in all 400 matches; second = tick/64; tick coverage >= 99.4%, max gap 7 ticks; merged event positions exact for 99.6% of kills, <= 1 tick stale. v30 round_end.tick is ~6.7 s after the decision (corrected via decided_tick).
  test: [MV.1]
  parameters: [tick rate]
  blocks: [xk]

- id: A-44
  statement: >-
    Round time 115 s from freeze end, bomb 41 s from the bomb_planted to the bomb_exploded event, and a freeze time
    of 15 or 20 s per match hold for all corpus matches (measured per channel set and platform).
  type: game_rule
  source: MV.1 measurement (supersedes A-14)
  status: supported
  evidence: [docs/data/csds_decoding.md, reports/experiments/20260928-1657_mv1_decoding/report.md]
  test: [MV.1]
  parameters: [round time / bomb timer / freeze time (s)]
  blocks: [wp_timeline]

- id: A-45
  statement: >-
    The MV.1 economy rules (docs/data/csds_decoding.md: loss counter +1/-2, T plant bonus 600, CT +50 per T killed,
    OT start 10000, weapon kill rewards) predict player_status.money at the next round start for >= 99% of
    player-rounds once per-player credits are modelled; one rule set covers builds 10521-10924.
  type: game_rule
  source: MV.1 measurement (supersedes A-13)
  status: open
  note: >-
    2026-09-28 (MV.1, F-07): 86-87% exact, 96.2-97.1% with one personal credit allowed; the remaining credits are
